name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The release signing key is not in the repository – CI builds are signed with the debug key.
      - name: Build Android app and Windows exe
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TabletMonitor-${{ github.sha }}
          path: |
            build/TabletMonitor.exe
            build/TabletMonitor.apk
          if-no-files-found: error
